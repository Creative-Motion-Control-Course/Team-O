<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team-O Plotter Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: #eee;
      font-family: 'Courier New', monospace;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    #status-bar {
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 30px;
    }

    #status-bar span {
      color: #f90;
    }

    #btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    #btn-row button {
      padding: 10px 28px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: background 0.2s, border-color 0.2s;
    }

    #btn-row button:hover {
      background: #2a2a2a;
      border-color: #f90;
    }

    #connect-btn.connected {
      border-color: #0f9;
      color: #0f9;
    }

    #disconnect-btn {
      border-color: #444;
      color: #888;
    }

    #disconnect-btn:hover {
      border-color: #f66 !important;
      color: #f66 !important;
    }

    .axes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .axis-panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
    }

    .axis-panel h2 {
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a2a;
    }

    .axis-panel.x h2 { color: #f66; }
    .axis-panel.y h2 { color: #6af; }
    .axis-panel.z h2 { color: #6f6; }
    .axis-panel.e h2 { color: #c9f; }

    .control {
      margin-bottom: 18px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .control-label {
      font-size: 0.72rem;
      color: #777;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .control-value {
      font-size: 0.85rem;
      color: #ccc;
      min-width: 40px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #333;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #555;
      border: 2px solid #888;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #777;
      border-color: #bbb;
    }

    .axis-panel.x input[type="range"]::-webkit-slider-thumb:active { border-color: #f66; }
    .axis-panel.y input[type="range"]::-webkit-slider-thumb:active { border-color: #6af; }
    .axis-panel.z input[type="range"]::-webkit-slider-thumb:active { border-color: #6f6; }
    .axis-panel.e input[type="range"]::-webkit-slider-thumb:active { border-color: #c9f; }

    .reset-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 6px 0;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #555;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .reset-btn:hover {
      border-color: #555;
      color: #aaa;
    }

    /* -- Spiral Control Panel -- */
    #spiral-panel {
      max-width: 1100px;
      margin: 24px auto 0;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #spiral-panel h3 {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      white-space: nowrap;
    }

    .spiral-btn {
      padding: 10px 32px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    #start-circle-btn {
      background: #1a2a1a;
      border: 1px solid #3a3a3a;
      color: #6f6;
    }

    #start-circle-btn:hover {
      border-color: #6f6;
      background: #1e301e;
    }

    #start-circle-btn.running {
      border-color: #6f6;
      background: #1e301e;
      box-shadow: 0 0 8px #6f633;
    }

    #stop-circle-btn {
      background: #2a1a1a;
      border: 1px solid #3a3a3a;
      color: #f66;
    }

    #stop-circle-btn:hover {
      border-color: #f66;
      background: #301e1e;
    }

    /* -- Spiral Parameters Panel -- */
    #spiral-params-panel {
      max-width: 1100px;
      margin: 24px auto 0;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 40px;
    }

    #spiral-params-panel h3 {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      white-space: nowrap;
    }

    .sparam {
      flex: 1;
    }

    .sparam-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    /* -- Jog Panel -- */
    #jog-panel {
      max-width: 1100px;
      margin: 24px auto 0;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    #jog-panel h3 {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      white-space: nowrap;
    }

    #jog-toggle {
      padding: 8px 20px;
      background: #222;
      color: #888;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s;
      white-space: nowrap;
    }

    #jog-toggle.active {
      border-color: #f90;
      color: #f90;
    }

    .jog-speed-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 160px;
    }

    .jog-speed-wrap label {
      font-size: 0.68rem;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    .jog-speed-wrap label span {
      color: #aaa;
    }

    .arrow-grid {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
    }

    .arrow-btn {
      width: 44px;
      height: 44px;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #666;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      user-select: none;
    }

    .arrow-btn:not(.disabled):hover {
      background: #2a2a2a;
      border-color: #555;
      color: #aaa;
    }

    .arrow-btn.active {
      background: #2a1a00;
      border-color: #f90;
      color: #f90;
    }

    .arrow-btn.disabled {
      opacity: 0.2;
      cursor: default;
    }

    .arrow-btn.center {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    #log {
      max-width: 1100px;
      margin: 30px auto 0;
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.75rem;
      color: #444;
      height: 220px;
      overflow-y: auto;
    }

    #readout-bar {
      max-width: 1100px;
      margin: 24px auto 8px;
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .readout-label {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #analog-a1-value {
      font-size: 1rem;
      color: #c9f;
      letter-spacing: 0.05em;
    }

    #log p { margin-bottom: 2px; }
    #log .sent  { color: #6af; }
    #log .info  { color: #888; }
    #log .error { color: #f66; }
  </style>
</head>
<body>

  <h1>Team-O Plotter Control</h1>
  <div id="status-bar">status: <span id="status-text">disconnected</span></div>

  <div id="btn-row">
    <button id="connect-btn">Connect to Serial</button>
    <button id="hello-btn" onclick="sendHello()">Send Hello</button>
    <button id="disconnect-btn" onclick="disconnect()">Disconnect</button>
  </div>

  <!-- SPIRAL CONTROL -->
  <div id="spiral-panel">
    <h3>Spiral</h3>
    <button id="start-spiral-btn" class="spiral-btn" onclick="startSpiral()">Start Spiral</button>
    <button id="stop-spiral-btn"  class="spiral-btn" onclick="stopSpiral()">Stop Spiral</button>
    <div style="width:1px; background:#2a2a2a; align-self:stretch; margin:0 8px;"></div>
    <h3>Motor E</h3>
    <button class="spiral-btn" id="enable-e-btn"  onclick="enableE()">Enable</button>
    <button class="spiral-btn" id="disable-e-btn" onclick="disableE()">Disable</button>
    <button class="spiral-btn" onclick="sendCmd('step_e_jog')">Step E Jog</button>
  </div>

  <!-- SPIRAL PARAMETERS -->
  <div id="spiral-params-panel">
    <h3>Spiral Parameters</h3>
    <div class="sparam">
      <div class="sparam-header">
        <span class="control-label">Rotation Speed</span>
        <span class="control-value" id="val-spiral-speed">1.3</span>
      </div>
      <input type="range" id="spiral-speed-slider" min="0" max="3" step="0.1" value="1.3"
             oninput="document.getElementById('val-spiral-speed').textContent = parseFloat(this.value).toFixed(1); send('set_spiral_speed', this.value)">
    </div>
    <div class="sparam">
      <div class="sparam-header">
        <span class="control-label">Radius <span style="color:#444; font-size:0.65rem;">(applied on Start)</span></span>
        <span class="control-value" id="val-spiral-radius">20.0</span>
      </div>
      <input type="range" id="spiral-radius-slider" min="15" max="25" step="0.5" value="20.0"
             oninput="document.getElementById('val-spiral-radius').textContent = parseFloat(this.value).toFixed(1)">
    </div>
  </div>

  <!-- JOG PANEL -->
  <div id="jog-panel">
    <h3>Jog</h3>
    <div class="arrow-grid">
      <!-- row 1 -->
      <div class="arrow-btn disabled"></div>
      <div class="arrow-btn disabled" id="btn-up"
           onmousedown="jogStart('y',1)" onmouseup="jogStop('y')" onmouseleave="jogStop('y')">&#9650;</div>
      <div class="arrow-btn disabled"></div>
      <!-- row 2 -->
      <div class="arrow-btn disabled" id="btn-left"
           onmousedown="jogStart('x',-1)" onmouseup="jogStop('x')" onmouseleave="jogStop('x')">&#9664;</div>
      <div class="arrow-btn center"></div>
      <div class="arrow-btn disabled" id="btn-right"
           onmousedown="jogStart('x',1)" onmouseup="jogStop('x')" onmouseleave="jogStop('x')">&#9654;</div>
      <!-- row 3 -->
      <div class="arrow-btn disabled"></div>
      <div class="arrow-btn disabled" id="btn-down"
           onmousedown="jogStart('y',-1)" onmouseup="jogStop('y')" onmouseleave="jogStop('y')">&#9660;</div>
      <div class="arrow-btn disabled"></div>
    </div>

    <!-- Z axis jog -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <div style="font-size:0.62rem; color:#444; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:2px;">Z</div>
      <div class="arrow-btn disabled" id="btn-z-up"
           onmousedown="jogStart('z',1)" onmouseup="jogStop('z')" onmouseleave="jogStop('z')">W</div>
      <div class="arrow-btn disabled" id="btn-z-down"
           onmousedown="jogStart('z',-1)" onmouseup="jogStop('z')" onmouseleave="jogStop('z')">S</div>
    </div>

    <!-- E axis jog -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <div style="font-size:0.62rem; color:#444; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:2px;">E</div>
      <div class="arrow-btn disabled" id="btn-e-up"
           onmousedown="jogStart('e',1)" onmouseup="jogStop('e')" onmouseleave="jogStop('e')">E</div>
      <div class="arrow-btn disabled" id="btn-e-down"
           onmousedown="jogStart('e',-1)" onmouseup="jogStop('e')" onmouseleave="jogStop('e')">D</div>
    </div>

    <div style="font-size:0.68rem; color:#444; line-height:1.8;">
      enable jog mode<br>arrows=x/y &nbsp; w/s=z &nbsp; e/d=e<br>or click the buttons
    </div>
  </div>

  <!-- ADVANCED SETTINGS -->
  <div id="advanced-settings">
    <h3>Advanced Settings</h3>

    <button id="jog-toggle" onclick="toggleJog()">off</button>
    <div class="jog-speed-wrap">
      <label>Jog Speed <span id="jog-speed-val">5.0</span></label>
      <input type="range" id="jog-speed" min="0.5" max="20" step="0.5" value="5">
    </div>
  </div>

  <div id="log"><p class="info">serial log will appear here...</p></div>

  <script>
    let writer = null;

    // -- Serial Connection --
    document.getElementById('connect-btn').onclick = async () => {
      if (writer) { log('already connected', 'info'); return; }
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        setStatus('connected', true);
        log('serial port opened at 115200', 'info');

        const reader = port.readable.getReader();
        (async () => {
          const decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value);
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed) continue;
              if (trimmed.startsWith('A1:')) {
                document.getElementById('analog-a1-value').textContent = trimmed.slice(3);
              } else if (trimmed.startsWith('Z:')) {
                // z position readout — available for future display
              } else {
                log('[teensy] ' + trimmed, 'info');
              }
            }
          }
        })();

      } catch (err) {
        setStatus('error: ' + err.message, false);
        log('connection failed: ' + err.message, 'error');
      }
    };

    // -- Send JSON RPC with one float arg --
    async function send(name, value) {
      if (!writer) { log('not connected', 'error'); return; }
      const msg = JSON.stringify({ name, args: [parseFloat(value)] }) + '\n';
      try {
        await writer.write(new TextEncoder().encode(msg));
        log(msg.trim(), 'sent');
      } catch (err) {
        log('send error: ' + err.message, 'error');
      }
    }

    // -- Send JSON RPC with no args --
    async function sendCmd(name) {
      if (!writer) { log('not connected', 'error'); return; }
      const msg = JSON.stringify({ name }) + '\n';
      try {
        await writer.write(new TextEncoder().encode(msg));
        log(msg.trim(), 'sent');
      } catch (err) {
        log('send error: ' + err.message, 'error');
      }
    }

    // -- Send JSON RPC with multiple args --
    async function sendArgs(name, args) {
      if (!writer) { log('not connected', 'error'); return; }
      const msg = JSON.stringify({ name, args }) + '\n';
      try {
        await writer.write(new TextEncoder().encode(msg));
        log(msg.trim(), 'sent');
      } catch (err) {
        log('send error: ' + err.message, 'error');
      }
    }

    // -- Disconnect --
    async function disconnect() {
      if (!writer) { log('not connected', 'error'); return; }
      try { await writer.close(); } catch (_) {}
      writer = null;
      setStatus('disconnected', false);
      document.getElementById('connect-btn').textContent = 'Connect to Serial';
      log('disconnected', 'info');
    }

    // -- Hello --
    async function sendHello() {
      if (!writer) { log('not connected', 'error'); return; }
      const msg = JSON.stringify({ name: 'hello' }) + '\n';
      await writer.write(new TextEncoder().encode(msg));
      log(msg.trim(), 'sent');
    }

    // -- Spiral Control --
    function startSpiral() {
      const speed  = parseFloat(document.getElementById('spiral-speed-slider').value);
      const radius = parseFloat(document.getElementById('spiral-radius-slider').value);
      document.getElementById('start-spiral-btn').classList.add('running');
      sendArgs('start_spiral', [speed, radius]);
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function stopSpiral() {
      document.getElementById('start-spiral-btn').classList.remove('running');
      await sendCmd('stop_spiral');        // stop kinematics
      await delay(100);
      await sendArgs('step_z_jog', [-5]); // z down
      await delay(1100);                  // wait for move (5mm / speed 5 ≈ 1s)
      await sendArgs('step_z_jog', [20]); // z lift clear
    }

    function enableE() {
      document.getElementById('enable-e-btn').style.borderColor  = '#6f6';
      document.getElementById('enable-e-btn').style.color        = '#6f6';
      document.getElementById('disable-e-btn').style.borderColor = '';
      document.getElementById('disable-e-btn').style.color       = '';
      sendCmd('enable_e');
    }

    function disableE() {
      document.getElementById('disable-e-btn').style.borderColor = '#f66';
      document.getElementById('disable-e-btn').style.color       = '#f66';
      document.getElementById('enable-e-btn').style.borderColor  = '';
      document.getElementById('enable-e-btn').style.color        = '';
      sendCmd('disable_e');
    }

    // -- Jog --
    let jogEnabled = false;
    const jogActive = { x: false, y: false, z: false, e: false };

    document.getElementById('jog-speed').addEventListener('input', function () {
      document.getElementById('jog-speed-val').textContent = parseFloat(this.value).toFixed(1);
    });

    function toggleJog() {
      jogEnabled = !jogEnabled;
      const btn = document.getElementById('jog-toggle');
      btn.textContent = jogEnabled ? 'on' : 'off';
      btn.classList.toggle('active', jogEnabled);
      ['btn-up','btn-down','btn-left','btn-right','btn-z-up','btn-z-down','btn-e-up','btn-e-down'].forEach(id => {
        document.getElementById(id).classList.toggle('disabled', !jogEnabled);
      });
      if (!jogEnabled) { jogStop('x'); jogStop('y'); jogStop('z'); jogStop('e'); }
      log('jog mode ' + (jogEnabled ? 'enabled' : 'disabled'), 'info');
    }

    function jogSpeed() {
      return parseFloat(document.getElementById('jog-speed').value);
    }

    function jogStart(axis, dir) {
      if (!jogEnabled || jogActive[axis]) return;
      jogActive[axis] = true;
      send('set_speed_' + axis, jogSpeed() * dir);
      const btnId = axis === 'z' ? (dir > 0 ? 'btn-z-up'   : 'btn-z-down')
                  : axis === 'e' ? (dir > 0 ? 'btn-e-up'   : 'btn-e-down')
                  : axis === 'x' ? (dir > 0 ? 'btn-right'  : 'btn-left')
                                 : (dir > 0 ? 'btn-up'     : 'btn-down');
      document.getElementById(btnId).classList.add('active');
    }

    function jogStop(axis) {
      if (!jogActive[axis]) return;
      jogActive[axis] = false;
      send('set_speed_' + axis, 0);
      ['btn-up','btn-down','btn-left','btn-right','btn-z-up','btn-z-down','btn-e-up','btn-e-down'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
    }

    // Keyboard jog
    const keyMap     = { ArrowRight: ()=>jogStart('x', 1), ArrowLeft: ()=>jogStart('x',-1), ArrowUp: ()=>jogStart('y', 1), ArrowDown: ()=>jogStart('y',-1), w: ()=>jogStart('z', 1), s: ()=>jogStart('z',-1), e: ()=>jogStart('e', 1), d: ()=>jogStart('e',-1) };
    const keyStopMap = { ArrowRight: ()=>jogStop('x'),      ArrowLeft: ()=>jogStop('x'),      ArrowUp: ()=>jogStop('y'),      ArrowDown: ()=>jogStop('y'),      w: ()=>jogStop('z'),       s: ()=>jogStop('z'),      e: ()=>jogStop('e'),      d: ()=>jogStop('e')      };

    document.addEventListener('keydown', e => {
      if (!jogEnabled) return;
      if (keyMap[e.key]) { e.preventDefault(); keyMap[e.key](); }
    });
    document.addEventListener('keyup', e => {
      if (keyStopMap[e.key]) { e.preventDefault(); keyStopMap[e.key](); }
    });

    // -- Knob handler --
    function onKnob(rpcName, slider, valueId) {
      const v = parseFloat(slider.value).toFixed(1);
      document.getElementById(valueId).textContent = v;
      send(rpcName, v);
    }

    // -- Reset axis sliders to 0 --
    function resetAxis(axis) {
      const controls = {
        x: [{ rpc: 'set_x_amplitude', id: 'val-x-amplitude' }, { rpc: 'set_x_frequency', id: 'val-x-frequency' }, { rpc: 'set_speed_x', id: 'val-speed-x' }],
        y: [{ rpc: 'set_y_amplitude', id: 'val-y-amplitude' }, { rpc: 'set_y_frequency', id: 'val-y-frequency' }, { rpc: 'set_speed_y', id: 'val-speed-y' }],
        z: [{ rpc: 'set_z_amplitude', id: 'val-z-amplitude' }, { rpc: 'set_z_frequency', id: 'val-z-frequency' }, { rpc: 'set_speed_z', id: 'val-speed-z' }],
        e: [{ rpc: 'set_e_amplitude', id: 'val-e-amplitude' }, { rpc: 'set_e_frequency', id: 'val-e-frequency' }, { rpc: 'set_speed_e', id: 'val-speed-e' }],
      };
      document.querySelector(`.axis-panel.${axis}`).querySelectorAll('input[type="range"]').forEach(s => s.value = 0);
      controls[axis].forEach(c => { document.getElementById(c.id).textContent = '0.0'; send(c.rpc, 0); });
    }

    // -- Gamepad --
    const DEADBAND   = 0.15;
    const GP_SEND_HZ = 50;

    let gpIndex    = null;
    let gpLastSend = 0;
    const gpPrev   = { x: 0, y: 0, z: 0 };

    function applyDeadband(v) {
      return Math.abs(v) < DEADBAND ? 0 : v;
    }

    function gpLoop(ts) {
      requestAnimationFrame(gpLoop);
      if (gpIndex === null || !jogEnabled) return;
      if (ts - gpLastSend < GP_SEND_HZ) return;
      gpLastSend = ts;

      const gp = navigator.getGamepads()[gpIndex];
      if (!gp) return;

      const spd = jogSpeed();

      // Left stick → X/Y (axes 0, 1)
      let ax = applyDeadband(gp.axes[0] || 0);
      let ay = applyDeadband(-(gp.axes[1] || 0));

      // D-pad buttons → X/Y (standard: 12=up, 13=down, 14=left, 15=right)
      if (gp.buttons[14] && gp.buttons[14].pressed) ax = -1;
      if (gp.buttons[15] && gp.buttons[15].pressed) ax =  1;
      if (gp.buttons[12] && gp.buttons[12].pressed) ay =  1;
      if (gp.buttons[13] && gp.buttons[13].pressed) ay = -1;

      // Right stick Y → Z (axis 3)
      let az = applyDeadband(-(gp.axes[3] || 0));

      const vx = parseFloat((ax * spd).toFixed(2));
      const vy = parseFloat((ay * spd).toFixed(2));
      const vz = parseFloat((az * spd).toFixed(2));

if (vx !== gpPrev.x) { send('set_speed_x', vx); gpPrev.x = vx; }
      if (vy !== gpPrev.y) { send('set_speed_y', vy); gpPrev.y = vy; }
      if (vz !== gpPrev.z) { send('set_speed_z', vz); gpPrev.z = vz; }
    }

    window.addEventListener('gamepadconnected', e => {
      gpIndex = e.gamepad.index;
      log('gamepad connected [' + gpIndex + ']: ' + e.gamepad.id, 'info');
    });
    window.addEventListener('gamepaddisconnected', e => {
      gpIndex = null;
      log('gamepad disconnected', 'info');
    });

    requestAnimationFrame(gpLoop);

    // -- UI helpers --
    function setStatus(text, connected) {
      const el = document.getElementById('status-text');
      el.textContent = text;
      el.style.color = connected ? '#0f9' : '#f66';
      const btn = document.getElementById('connect-btn');
      btn.classList.toggle('connected', connected);
      if (connected) btn.textContent = 'Connected';
    }

    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const p = document.createElement('p');
      p.className = type;
      p.textContent = msg;
      logEl.appendChild(p);
      logEl.scrollTop = logEl.scrollHeight;
    }
  </script>

</body>
</html>
